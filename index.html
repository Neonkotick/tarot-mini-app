<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Таро • Расклад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --wood: #1c120c;
      --gold: #c9a227;
      --gold-dim: rgba(201,162,39,0.45);
      --text: #e8e0d5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--wood);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .table-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(80,40,20,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 20% 80%, rgba(40,20,10,0.5) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(50,25,15,0.4) 0%, transparent 40%),
        linear-gradient(180deg, #241610 0%, #120a08 100%);
    }
    .table-bg::before {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      opacity: 0.6; pointer-events: none;
    }
    .velvet {
      position: fixed; top: 10%; bottom: 10%; left: 50%; transform: translateX(-50%);
      width: min(94vw, 460px);
      background: radial-gradient(ellipse at 50% 0%, rgba(90,30,60,0.25) 0%, transparent 60%), linear-gradient(180deg, #1f0f22 0%, #140a18 100%);
      border-radius: 10px;
      box-shadow: 0 0 0 1px rgba(201,162,39,0.12), 0 0 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.4);
      z-index: 1; pointer-events: none;
    }
    .candle-glow {
      position: fixed; width: 120px; height: 120px; border-radius: 50%;
      filter: blur(40px); opacity: 0.35; z-index: 1; pointer-events: none;
      animation: flicker 4s ease-in-out infinite alternate;
    }
    .candle-left  { left: 3%;  top: 22%; background: #c97b2a; }
    .candle-right { right: 3%; top: 28%; background: #b86a22; animation-delay: 1.5s; }
    @keyframes flicker {
      from { opacity: 0.25; transform: scale(1); }
      to   { opacity: 0.42; transform: scale(1.08); }
    }
    .dust {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 15% 25%, rgba(201,162,39,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 15%, rgba(255,240,200,0.35) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 70%, rgba(201,162,39,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.25) 0%, transparent 100%);
      background-size: 180px 180px; opacity: 0.5; will-change: transform;
    }
    .app {
      position: relative; z-index: 10; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 14px 40px;
    }
    .title {
      font-size: 12px; letter-spacing: 3.5px; text-transform: uppercase;
      color: rgba(232,224,213,0.5); margin-bottom: 28px; text-align: center;
    }
    .free-info {
      font-size: 12px; color: rgba(201,162,39,0.7); margin-bottom: 18px; letter-spacing: 1px;
      text-align: center;
    }
    .btn-draw {
      position: relative; padding: 18px 42px; min-width: 220px;
      background: linear-gradient(180deg, #2a1c12 0%, #1a100a 100%);
      border: 1px solid var(--gold-dim); border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,220,150,0.08);
      cursor: pointer; user-select: none; transition: transform 0.2s; text-align: center;
    }
    .btn-draw::before {
      content: ''; position: absolute; inset: 5px;
      border: 1px solid rgba(201,162,39,0.2); border-radius: 3px; pointer-events: none;
    }
    .btn-draw:active { transform: scale(0.97); }
    .btn-draw .label { font-size: 15px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
    .btn-draw .sub { display: block; margin-top: 6px; font-size: 11px; color: rgba(232,224,213,0.45); letter-spacing: 1px; }

    .spread {
      display: none; width: 100%; max-width: 440px;
      flex-direction: column; align-items: center; gap: 18px;
    }
    .spread.active { display: flex; }

    .hint {
      font-size: 12px; color: rgba(201,162,39,0.65); letter-spacing: 1px;
      text-align: center; min-height: 18px;
    }

    .deck-area {
      height: 190px; width: 100%; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .deck-stack {
      position: relative; width: 110px; height: 160px;
    }
    .deck-card {
      position: absolute; inset: 0; border-radius: 8px;
      background:
        radial-gradient(circle at 50% 45%, #2a1a38 0%, #120c1a 70%),
        repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(201,162,39,0.08) 5px, rgba(201,162,39,0.08) 6px);
      border: 1px solid rgba(201,162,39,0.4);
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
    }
    .deck-card::before {
      content: '✦'; font-size: 26px; color: rgba(201,162,39,0.5);
      text-shadow: 0 0 12px rgba(201,162,39,0.4);
    }
    .deck-card::after {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(201,162,39,0.2); border-radius: 4px;
    }
    .deck-stack.shuffling .deck-card {
      animation: shuffleCard 0.55s ease-in-out infinite alternate;
    }
    .deck-stack.shuffling .deck-card:nth-child(1) { animation-delay: 0s; }
    .deck-stack.shuffling .deck-card:nth-child(2) { animation-delay: 0.08s; }
    .deck-stack.shuffling .deck-card:nth-child(3) { animation-delay: 0.16s; }
    .deck-stack.shuffling .deck-card:nth-child(4) { animation-delay: 0.24s; }
    .deck-stack.shuffling .deck-card:nth-child(5) { animation-delay: 0.32s; }
    @keyframes shuffleCard {
      0%   { transform: translate(0,0) rotate(0deg); }
      50%  { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); }
      100% { transform: translate(0,0) rotate(0deg); }
    }

    .cards {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      perspective: 1200px; min-height: 190px;
    }

    .card-wrap {
      width: 112px; height: 168px; position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
      opacity: 0;
    }
    .card-wrap.dealt {
      animation: dealIn 0.55s ease forwards;
    }
    .card-wrap:nth-child(1).dealt { animation-delay: 0.05s; }
    .card-wrap:nth-child(2).dealt { animation-delay: 0.18s; }
    .card-wrap:nth-child(3).dealt { animation-delay: 0.31s; }
    @keyframes dealIn {
      from { opacity: 0; transform: translateY(-40px) scale(0.85); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-wrap.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .card-wrap.glow-flip {
      animation: glowPulse 0.85s ease;
    }
    @keyframes glowPulse {
      0%   { filter: drop-shadow(0 0 0 rgba(201,162,39,0)); }
      40%  { filter: drop-shadow(0 0 18px rgba(201,162,39,0.75)); }
      100% { filter: drop-shadow(0 0 6px rgba(201,162,39,0.25)); }
    }

    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 9px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45), 0 10px 26px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    /* Рубашка */
    .card-back {
      background: radial-gradient(circle at 50% 40%, #2e1c42 0%, #140e1c 75%);
      border: 1px solid rgba(201,162,39,0.45);
      justify-content: center;
      z-index: 2;
    }
    .card-back .ornament {
      width: 70%; height: 70%; border: 1px solid rgba(201,162,39,0.25);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .card-back .ornament::before {
      content: '✦'; font-size: 28px; color: rgba(201,162,39,0.55);
      text-shadow: 0 0 14px rgba(201,162,39,0.45);
    }
    .card-back .ornament::after {
      content: ''; position: absolute; inset: 6px;
      border: 1px solid rgba(201,162,39,0.15); border-radius: 4px;
    }

    /* Лицевая сторона */
    .card-front {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      padding: 8px 6px 10px;
      text-align: center;
      justify-content: flex-start;
      border: 1px solid rgba(201,162,39,0.5);
      background: #120c18;
      z-index: 1;
    }
    .card-front .arcana-art {
      width: 100%; height: 62px; margin: 2px 0 6px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 32px; position: relative;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-position {
      font-size: 8px; letter-spacing: 1.4px; text-transform: uppercase;
      color: rgba(201,162,39,0.75); margin-bottom: 2px;
    }
    .card-name {
      font-size: 12px; color: var(--gold); margin-bottom: 2px; line-height: 1.15;
      text-shadow: 0 0 8px rgba(201,162,39,0.4);
      font-weight: bold;
    }
    .card-orient {
      font-size: 9px; color: rgba(232,224,213,0.45); margin-bottom: 5px;
    }
    .card-meaning {
      font-size: 10px; line-height: 1.35; color: rgba(232,224,213,0.92);
    }

    /* Уникальные сильные фоны арканов */
    .art-shut        { background: linear-gradient(160deg, #4a3520 0%, #1e1408 100%); color: #f0d080; }
    .art-mag         { background: linear-gradient(160deg, #3a2450 0%, #140820 100%); color: #e0b0ff; }
    .art-zhritsa     { background: linear-gradient(160deg, #1e2a48 0%, #0a1020 100%); color: #b0d0ff; }
    .art-imperatrica { background: linear-gradient(160deg, #4a2038 0%, #1c0a18 100%); color: #ffc0d8; }
    .art-imperator   { background: linear-gradient(160deg, #3a2c18 0%, #181008 100%); color: #f0d080; }
    .art-ierofant    { background: linear-gradient(160deg, #2a2440 0%, #100c1c 100%); color: #d0c0ff; }
    .art-vlyublennye { background: linear-gradient(160deg, #4a2038 0%, #1c0a16 100%); color: #ffb0c8; }
    .art-kolesnica   { background: linear-gradient(160deg, #1e3048 0%, #0a1420 100%); color: #a0d8ff; }
    .art-sila        { background: linear-gradient(160deg, #4a3818 0%, #1c1408 100%); color: #ffe080; }
    .art-otshelnik   { background: linear-gradient(160deg, #222838 0%, #0c1018 100%); color: #c0d0e8; }
    .art-koleso      { background: linear-gradient(160deg, #3a2848 0%, #160e20 100%); color: #e0b0ff; }
    .art-spravedlivost { background: linear-gradient(160deg, #243040 0%, #0c141c 100%); color: #b8d8f0; }
    .art-poveshennyy { background: linear-gradient(160deg, #382038 0%, #140a14 100%); color: #e0b0e0; }
    .art-smert       { background: linear-gradient(160deg, #2a2a2a 0%, #0c0c0c 100%); color: #d8d8d8; }
    .art-umerennost  { background: linear-gradient(160deg, #1e3840 0%, #0a181c 100%); color: #a0f0e0; }
    .art-dyavol      { background: linear-gradient(160deg, #3a1520 0%, #16080c 100%); color: #ff8090; }
    .art-bashnya     { background: linear-gradient(160deg, #3a2c20 0%, #181008 100%); color: #ffc070; }
    .art-zvezda      { background: linear-gradient(160deg, #142038 0%, #060e18 100%); color: #90d0ff; }
    .art-luna        { background: linear-gradient(160deg, #201838 0%, #0c0818 100%); color: #d0b8ff; }
    .art-solntse     { background: linear-gradient(160deg, #4a3818 0%, #1c1408 100%); color: #ffe890; }
    .art-sud         { background: linear-gradient(160deg, #2c2c1c 0%, #14140a 100%); color: #f0e090; }
    .art-mir         { background: linear-gradient(160deg, #1e3840 0%, #0a1c20 100%); color: #b0f0d0; }

    .summary {
      width: 100%; padding: 14px 16px; background: rgba(18,10,20,0.82);
      border: 1px solid rgba(201,162,39,0.22); border-radius: 8px;
      font-size: 13px; line-height: 1.5; color: rgba(232,224,213,0.9); text-align: center;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .summary.visible {
      opacity: 1; transform: translateY(0);
    }
    .summary strong { color: var(--gold); font-weight: normal; }

    .actions {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      margin-top: 4px; width: 100%;
    }
    .btn-again {
      padding: 12px 26px; border: 1px solid rgba(201,162,39,0.4); background: transparent;
      color: var(--gold); font-family: inherit; font-size: 12px; letter-spacing: 1.8px;
      text-transform: uppercase; border-radius: 4px; cursor: pointer; min-width: 200px;
    }
    .btn-again:active { background: rgba(201,162,39,0.1); }
    .pay-hint { font-size: 11px; color: rgba(232,224,213,0.45); text-align: center; max-width: 280px; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="table-bg"></div>
  <div class="velvet"></div>
  <div class="candle-glow candle-left"></div>
  <div class="candle-glow candle-right"></div>
  <div class="dust" id="dust"></div>

  <div class="app">
    <div id="start-screen">
      <div class="title">Три карты • Прошлое • Настоящее • Будущее</div>
      <div class="free-info" id="free-info">Сегодня бесплатных раскладов: 3</div>
      <div class="btn-draw" id="draw-btn">
        <span class="label">Открыть расклад</span>
        <span class="sub">коснуться судьбы</span>
      </div>
    </div>

    <div class="spread" id="spread-screen">
      <div class="hint" id="hint">Тусуем колоду…</div>

      <div class="deck-area" id="deck-area">
        <div class="deck-stack" id="deck-stack">
          <div class="deck-card" style="--sx:6px;--sy:-8px;--sr:4deg; transform: translate(2px,-2px) rotate(2deg);"></div>
          <div class="deck-card" style="--sx:-7px;--sy:5px;--sr:-5deg; transform: translate(-1px,1px) rotate(-1deg);"></div>
          <div class="deck-card" style="--sx:5px;--sy:7px;--sr:3deg; transform: translate(1px,2px) rotate(1deg);"></div>
          <div class="deck-card" style="--sx:-4px;--sy:-6px;--sr:-3deg; transform: translate(-2px,-1px) rotate(-2deg);"></div>
          <div class="deck-card" style="--sx:3px;--sy:4px;--sr:2deg;"></div>
        </div>
      </div>

      <div class="cards hidden" id="cards-container"></div>
      <div class="summary" id="summary"></div>

      <div class="actions">
        <button class="btn-again hidden" id="again-btn">Новый расклад</button>
        <div class="pay-hint hidden" id="pay-hint">
          Бесплатные расклады на сегодня закончились.<br>
          Каждое открытие карты — ⭐ 5
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#120a08');
      tg.setBackgroundColor('#120a08');
    }

    const deck = [
      { name: "Шут",          symbol: "🃏", art: "art-shut",        upright: "Новые начинания, свобода, спонтанность", reversed: "Безрассудство, наивность, хаос" },
      { name: "Маг",          symbol: "✧",  art: "art-mag",         upright: "Сила воли, мастерство, концентрация", reversed: "Манипуляции, неуверенность" },
      { name: "Жрица",        symbol: "☽",  art: "art-zhritsa",     upright: "Интуиция, тайны, внутренний голос", reversed: "Секреты, подавленные чувства" },
      { name: "Императрица",  symbol: "♛",  art: "art-imperatrica", upright: "Изобилие, забота, творчество", reversed: "Застой, зависимость" },
      { name: "Император",    symbol: "♚",  art: "art-imperator",   upright: "Структура, власть, стабильность", reversed: "Тирания, жёсткость" },
      { name: "Иерофант",     symbol: "✝",  art: "art-ierofant",    upright: "Традиции, учение, духовный путь", reversed: "Догма, бунт против правил" },
      { name: "Влюблённые",   symbol: "♡",  art: "art-vlyublennye", upright: "Выбор, гармония, союз", reversed: "Разлад, сомнения" },
      { name: "Колесница",    symbol: "⚔",  art: "art-kolesnica",   upright: "Победа, движение вперёд, контроль", reversed: "Хаос, потеря направления" },
      { name: "Сила",         symbol: "♌",  art: "art-sila",        upright: "Мужество, мягкая сила, терпение", reversed: "Слабость, сомнения в себе" },
      { name: "Отшельник",    symbol: "🕯",  art: "art-otshelnik",   upright: "Поиск истины, уединение, мудрость", reversed: "Изоляция, одиночество" },
      { name: "Колесо Фортуны", symbol: "☯", art: "art-koleso",      upright: "Перемены, удача, циклы", reversed: "Неудача, сопротивление переменам" },
      { name: "Справедливость", symbol: "⚖", art: "art-spravedlivost", upright: "Баланс, правда, ответственность", reversed: "Несправедливость, предвзятость" },
      { name: "Повешенный",   symbol: "⤵",  art: "art-poveshennyy", upright: "Жертва, новый взгляд, пауза", reversed: "Застой, бессмысленные жертвы" },
      { name: "Смерть",       symbol: "☠",  art: "art-smert",       upright: "Трансформация, конец старого", reversed: "Страх перемен, застой" },
      { name: "Умеренность",  symbol: "⚗",  art: "art-umerennost",  upright: "Гармония, баланс, исцеление", reversed: "Крайности, дисбаланс" },
      { name: "Дьявол",       symbol: "⛧",  art: "art-dyavol",      upright: "Привязанности, искушения, тень", reversed: "Освобождение, осознание" },
      { name: "Башня",        symbol: "⚡",  art: "art-bashnya",     upright: "Внезапные перемены, разрушение иллюзий", reversed: "Избегание краха, страх" },
      { name: "Звезда",       symbol: "★",  art: "art-zvezda",      upright: "Надежда, вдохновение, исцеление", reversed: "Отчаяние, потеря веры" },
      { name: "Луна",         symbol: "☾",  art: "art-luna",        upright: "Иллюзии, страхи, подсознание", reversed: "Ясность, выход из тумана" },
      { name: "Солнце",       symbol: "☀",  art: "art-solntse",     upright: "Успех, радость, ясность", reversed: "Временные трудности, эго" },
      { name: "Суд",          symbol: "📯", art: "art-sud",         upright: "Пробуждение, решение, призвание", reversed: "Сомнения, отказ от перемен" },
      { name: "Мир",          symbol: "✦",  art: "art-mir",         upright: "Завершение, целостность, достижение", reversed: "Незавершённость, задержки" }
    ];

    const positions = ["Прошлое", "Настоящее", "Будущее"];
    const DAILY_FREE = 3;
    const FLIP_PRICE = 5;
    const STORAGE_DATE = 'tarot_day';
    const STORAGE_FREE = 'tarot_free_today';

    let currentCards = [];
    let flippedCount = 0;
    let isFreeSpread = true;

    function todayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    }

    function getFreeLeft() {
      const savedDate = localStorage.getItem(STORAGE_DATE);
      const today = todayKey();
      if (savedDate !== today) {
        localStorage.setItem(STORAGE_DATE, today);
        localStorage.setItem(STORAGE_FREE, String(DAILY_FREE));
        return DAILY_FREE;
      }
      return Math.max(0, parseInt(localStorage.getItem(STORAGE_FREE) || DAILY_FREE, 10));
    }

    function spendFreeSpread() {
      const left = getFreeLeft();
      if (left > 0) {
        localStorage.setItem(STORAGE_FREE, String(left - 1));
        return true;
      }
      return false;
    }

    function updateFreeInfo() {
      const left = getFreeLeft();
      const el = document.getElementById('free-info');
      if (left > 0) el.textContent = `Сегодня бесплатных раскладов: ${left}`;
      else el.textContent = `Бесплатные расклады на сегодня закончились · ⭐${FLIP_PRICE} за карту`;
    }

    const dust = document.getElementById('dust');
    function moveDust(x, y) {
      const cx = (x / window.innerWidth - 0.5) * 2;
      const cy = (y / window.innerHeight - 0.5) * 2;
      dust.style.transform = `translate(${cx * 12}px, ${cy * 12}px)`;
    }
    window.addEventListener('mousemove', e => moveDust(e.clientX, e.clientY));
    window.addEventListener('deviceorientation', e => {
      if (e.gamma != null && e.beta != null) {
        moveDust((e.gamma + 90) / 180 * window.innerWidth, (e.beta + 90) / 180 * window.innerHeight);
      }
    });

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeSummary(cards) {
      const names = cards.map(c => c.name).join(', ');
      const reversedCount = cards.filter(c => c.isReversed).length;
      const variants = {
        0: [
          `Карты <strong>${names}</strong> складываются в ясный путь. Прошлое отпустило, настоящее поддерживает, будущее открывает двери. Силы на твоей стороне.`,
          `Связка <strong>${names}</strong> говорит о гармонии. То, что было, подготовило почву. Сейчас — момент силы. Впереди — светлый поворот.`
        ],
        1: [
          `В раскладе <strong>${names}</strong> одна карта перевёрнута — это точка внимания. Не препятствие, а приглашение посмотреть глубже. Остальное течёт в нужном направлении.`,
          `Карты <strong>${names}</strong> показывают: путь в целом благоприятен, но есть урок, который стоит принять. Он откроет следующую дверь.`
        ],
        2: [
          `Связка <strong>${names}</strong> требует осторожности. Две перевёрнутые карты — знак, что пора замедлиться и пересмотреть курс. Будущее ещё можно изменить.`,
          `Расклад <strong>${names}</strong> шепчет о внутренних противоречиях. Прошлое и настоящее тянут в разные стороны. Найди точку равновесия — и будущее прояснится.`
        ],
        3: [
          `Все три карты — <strong>${names}</strong> — перевёрнуты. Это не приговор, а глубокая тень. Сейчас важно не действовать, а слушать. Ответ придёт из тишины.`,
          `Расклад <strong>${names}</strong> говорит о периоде очищения. Старое должно уйти. Не сопротивляйся — то, что разрушается, освобождает место новому.`
        ]
      };
      const list = variants[reversedCount] || variants[1];
      return list[Math.floor(Math.random() * list.length)];
    }

    function resetSpreadUI() {
      flippedCount = 0;
      currentCards = [];
      document.getElementById('summary').classList.remove('visible');
      document.getElementById('summary').innerHTML = '';
      document.getElementById('again-btn').classList.add('hidden');
      document.getElementById('pay-hint').classList.add('hidden');
      document.getElementById('cards-container').innerHTML = '';
      document.getElementById('cards-container').classList.add('hidden');
      document.getElementById('deck-area').classList.remove('hidden');
      document.getElementById('hint').textContent = 'Тусуем колоду…';
    }

    function startDrawSequence() {
      isFreeSpread = spendFreeSpread();
      updateFreeInfo();

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('spread-screen').classList.add('active');
      resetSpreadUI();

      if (!isFreeSpread) document.getElementById('pay-hint').classList.remove('hidden');

      const stack = document.getElementById('deck-stack');
      stack.classList.add('shuffling');

      setTimeout(() => {
        stack.classList.remove('shuffling');
        document.getElementById('deck-area').classList.add('hidden');
        dealFaceDownCards();
      }, 1400);
    }

    function dealFaceDownCards() {
      currentCards = shuffle(deck).slice(0, 3).map(c => ({
        ...c,
        isReversed: Math.random() < 0.5
      }));
      flippedCount = 0;

      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      container.classList.remove('hidden');

      document.getElementById('hint').textContent = isFreeSpread
        ? 'Коснись карты, чтобы открыть её'
        : `Коснись карты · ⭐${FLIP_PRICE} за открытие`;

      currentCards.forEach((card, i) => {
        const meaning = card.isReversed ? card.reversed : card.upright;
        const orient = card.isReversed ? 'перевёрнутая' : 'прямая';

        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.dataset.index = i;
        wrap.innerHTML = `
          <div class="card-face card-back">
            <div class="ornament"></div>
          </div>
          <div class="card-face card-front">
            <div class="card-position">${positions[i]}</div>
            <div class="arcana-art ${card.art}">${card.symbol}</div>
            <div class="card-name">${card.name}</div>
            <div class="card-orient">${orient}</div>
            <div class="card-meaning">${meaning}</div>
          </div>
        `;

        wrap.addEventListener('click', () => onCardTap(wrap, i));
        container.appendChild(wrap);
        setTimeout(() => wrap.classList.add('dealt'), 30);
      });
    }

    function flipCard(wrap) {
      if (wrap.classList.contains('flipped')) return;
      wrap.classList.add('flipped', 'glow-flip');
      flippedCount++;

      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      if (flippedCount >= 3) {
        document.getElementById('hint').textContent = '';
        setTimeout(() => {
          const summaryEl = document.getElementById('summary');
          summaryEl.innerHTML = makeSummary(currentCards);
          summaryEl.classList.add('visible');
          document.getElementById('again-btn').classList.remove('hidden');
        }, 700);
      } else {
        document.getElementById('hint').textContent = isFreeSpread
          ? `Открыто ${flippedCount} из 3 — коснись следующей`
          : `Открыто ${flippedCount} из 3 · ⭐${FLIP_PRICE} за следующую`;
      }
    }

    async function onCardTap(wrap, index) {
      if (wrap.classList.contains('flipped')) return;

      if (isFreeSpread) {
        flipCard(wrap);
        return;
      }

      await payForFlip(wrap);
    }

    async function payForFlip(wrap) {
      if (!tg) {
        alert('Открой приложение внутри Telegram');
        return;
      }

      try {
        const userId = tg.initDataUnsafe?.user?.id || 'unknown';
        const response = await fetch('/api/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, amount: FLIP_PRICE })
        });

        const data = await response.json();

        if (!data.invoiceUrl) {
          console.error(data);
          alert('Не удалось создать счёт. Нужен деплой через Cloudflare Pages + BOT_TOKEN.');
          return;
        }

        tg.openInvoice(data.invoiceUrl, (status) => {
          if (status === 'paid') {
            flipCard(wrap);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          }
        });
      } catch (e) {
        console.error(e);
        alert('Ошибка при создании платежа');
      }
    }

    document.getElementById('draw-btn').addEventListener('click', startDrawSequence);
    document.getElementById('again-btn').addEventListener('click', () => {
      document.getElementById('spread-screen').classList.remove('active');
      document.getElementById('start-screen').classList.remove('hidden');
      updateFreeInfo();
      setTimeout(startDrawSequence, 250);
    });

    updateFreeInfo();
  </script>
</body>
</html>
